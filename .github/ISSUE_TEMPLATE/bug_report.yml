name: Bug report
description: Something is broken or behaves incorrectly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security issues: do not open a public issue.** See [SECURITY.md](../blob/main/SECURITY.md).
        Never paste API keys, even revoked ones.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Hosted (recommendr.app)
        - Self-hosted (Docker Compose)
        - Local development
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "v0.1.0 or commit SHA"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact API keys, emails and anything private.
      render: shell
